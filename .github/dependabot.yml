version: 2
# The 7-day cooldown matches minimumReleaseAge in pnpm-workspace.yaml: a
# release has a week to be caught and pulled before a PR proposes it.
# Security updates skip this cooldown but not pnpm's, so a security fix
# younger than 7 days needs a minimumReleaseAgeExclude entry first.
updates:
  # GitHub Actions across all workflows. Keeps the SHA pins from rotting — the
  # Node 20 deprecation slipped in precisely because nothing watched these.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions

  # Plugin dependencies (root package.json + pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
      prod-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build
      # Emits build(deps): / build(deps-dev): - the release policy releases a
      # patch for build(deps), so production bumps ship and dev bumps do not.
      include: scope
    labels:
      - dependencies

  # Docs site (docs/package.json + docs/pnpm-lock.yaml).
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docs-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: build
    labels:
      - dependencies
      - documentation
