name: PR Title

# The shared release pipeline plans versions from Conventional Commits, and the
# squash-merge commit is the PR title. Validate it as a Conventional Commit so a
# bad title can't produce a wrong (or missing) release.
on:
    pull_request_target:
        types: [opened, edited, synchronize, reopened]

permissions:
    pull-requests: read

concurrency:
    group: pr-title-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    validate:
        name: Validate PR title
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
              with:
                  egress-policy: audit
            - name: Lint PR title
              uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      feat
                      fix
                      perf
                      docs
                      style
                      refactor
                      test
                      build
                      ci
                      chore
                      revert
                      release
