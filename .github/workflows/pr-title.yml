name: PR Title

# The shared release pipeline plans versions from Conventional Commits, and the
# squash-merge commit is the PR title. Validate it as a Conventional Commit so a
# bad title can't produce a wrong (or missing) release.
on:
    pull_request_target:
        types: [opened, edited, synchronize, reopened]

permissions:
    pull-requests: read

concurrency:
    group: pr-title-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    validate:
        name: Validate PR title
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
              with:
                  egress-policy: audit
            - name: Lint PR title
              uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      feat
                      fix
                      perf
                      docs
                      style
                      refactor
                      test
                      build
                      ci
                      chore
                      revert
                      release
