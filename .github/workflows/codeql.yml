name: CodeQL

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    schedule:
        - cron: '0 6 * * 1'

concurrency:
    group: codeql-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    analyze:
        name: Analyze (${{ matrix.language }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
            security-events: write
            actions: read
        strategy:
            fail-fast: false
            matrix:
                language: [javascript-typescript, actions]
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
              with:
                  egress-policy: audit
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Initialize CodeQL
              uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  languages: ${{ matrix.language }}
                  queries: security-extended
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
              with:
                  category: "/language:${{ matrix.language }}"
                  # Wait so a red Security-tab processing failure fails the check
                  # (required on master). Alert *count* still does not fail analyze;
                  # use a ruleset code_scanning rule for that quality gate.
                  wait-for-processing: true
